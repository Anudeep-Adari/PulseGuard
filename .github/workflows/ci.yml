name: PulseGuard CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - '.coderabbit.yaml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - '.coderabbit.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET 8 LTS)
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore PulseGuard.sln

      - name: Build Solution (Release)
        run: dotnet build PulseGuard.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test PulseGuard.sln -c Release --no-build --verbosity normal
