name: PulseGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 8 LTS)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore PulseGuard.sln

      - name: Build Solution (Release)
        run: dotnet build PulseGuard.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test PulseGuard.sln -c Release --no-build --verbosity normal
